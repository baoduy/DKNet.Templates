services:
  neo4j:
    image: neo4j:5
    container_name: dknet-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser  → http://localhost:7474
      - "7687:7687"   # Bolt protocol  → bolt://localhost:7687
    environment:
      NEO4J_AUTH: neo4j/codegraph123
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
    volumes:
      - ./data:/data:rw
      - ./logs:/logs:rw
      - .:/import
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
