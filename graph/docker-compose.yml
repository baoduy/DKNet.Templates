services:
  falkordb:
    image: falkordb/falkordb-server:edge-alpine
    container_name: ${FALKORDB_CONTAINER_NAME:-codegraph-falkordb}
    ports:
      - "6379:6379"
    environment:
      - REDIS_ARGS=--requirepass ${FALKORDB_PASSWORD:-codegraph123} --appendonly yes --appendfsync everysec --dir /var/lib/falkordb/data --maxmemory 1gb --maxmemory-policy allkeys-lru
      - FALKORDB_ARGS=THREAD_COUNT 8 CACHE_SIZE 50 TIMEOUT_MAX 60000 TIMEOUT_DEFAULT 30000 QUERY_MEM_CAPACITY 104857600
    volumes:
      - type: bind
        source: ./data/graph-data
        target: /var/lib/falkordb/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${FALKORDB_PASSWORD:-codegraph123}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - codegraph-network

  falkordb-browser:
    image: falkordb/falkordb-browser:v1.9.2
    container_name: codegraph-browser
    ports:
      - "3000:3000"
    environment:
      - FALKORDB_URL=redis://falkordb:6379
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-codegraph123}
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - codegraph-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: docsearch-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - type: bind
        source: ./data/vector-data
        target: /qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - codegraph-network

networks:
  codegraph-network:
    driver: bridge
