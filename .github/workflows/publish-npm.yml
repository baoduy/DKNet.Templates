name: Publish npm Package

# Temporarily disabled (DRK-1526): every push to `main` failed with
# `npm error code E404 ... PUT https://registry.npmjs.org/@baoduy%2fdknet-plugin`,
# an unauthenticated write — `secrets.NPM_TOKEN` is not set on this repository.
# Manual-only until the owner decides whether `@baoduy/dknet-plugin` is published
# at all. To re-enable, restore the `push` trigger below and set `NPM_TOKEN`.
#
# on:
#   push:
#     branches:
#       - main
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
