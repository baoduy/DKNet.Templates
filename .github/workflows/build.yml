name: Build

'on':
  pull_request:
  push:
    branches:
      - dev

jobs:
  build:
    name: Build and test (${{ matrix.configuration }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/DKNet.Templates.sln

      - name: Build
        run: dotnet build src/DKNet.Templates.sln -c ${{ matrix.configuration }} --no-restore

      - name: Test
        run: >-
          dotnet test src/DKNet.Templates.sln
          -c ${{ matrix.configuration }}
          --no-build
          --settings src/coverage.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.configuration }}
          path: "**/TestResults/**"
          if-no-files-found: ignore
