name: Build

'on':
  pull_request:
  push:
    branches:
      - dev

jobs:
  build:
    name: Build and test (${{ matrix.configuration }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DKNet.Templates.slnx

      - name: Build
        run: dotnet build DKNet.Templates.slnx -c ${{ matrix.configuration }} --no-restore

      - name: Test
        run: >-
          dotnet test DKNet.Templates.slnx
          -c ${{ matrix.configuration }}
          --no-build
          --settings src/coverage.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.configuration }}
          path: "**/TestResults/**"
          if-no-files-found: ignore

  plugin:
    name: Validate AI plugin (skills, agents, manifests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: validate-plugin.sh
        run: ./validate-plugin.sh

      - name: Skills CLI discovery (npx skills add --list)
        run: npx -y skills@latest add . --list -y | grep -E 'dknet-feature|dknet-endpoint-config' || (echo "skills CLI did not discover the dknet skills" && exit 1)
