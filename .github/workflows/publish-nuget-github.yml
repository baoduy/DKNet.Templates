name: Build and Publish NuGet Package

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      # Consumed by publish-npm so the skills package carries the same version as the NuGet template package.
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Versioning
      - name: Calculate version
        id: version
        uses: paulhatch/semantic-version@v6.0.2
        with:
          tag_prefix: "v"
          # Major is never bumped by this pipeline. It is the repository owner's
          # decision, taken by hand: tag `main` with `v<N>.0.0`, then re-run this
          # workflow. This sentinel matches no commit, so `!:`, `BREAKING CHANGE:`
          # and the retired `(MAJOR)` marker all bump nothing.
          major_pattern: "DKNET_MAJOR_IS_TAGGED_BY_HAND_NEVER_BY_CI"
          # minor_pattern is deliberately absent — the action's own default is
          # /feat(\(.+\))?:/, which is the Conventional Commit style already used
          # on dev. Do not re-add an override.
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false
          search_commit_body: false

      - name: Print the version
        run: echo ${{ steps.version.outputs.version }}
    
    # Dotnet build and publish
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/DKNet.Templates.sln

      - name: Build
        run: dotnet build src/DKNet.Templates.sln -c Release --no-restore

      - name: Test
        run: >-
          dotnet test src/DKNet.Templates.sln
          -c Release
          --no-build
          --settings src/coverage.runsettings
          --collect:"XPlat Code Coverage"

      - name: Set nuspec version
        run: |
          sed -i.bak "s|<version>.*</version>|<version>${{ steps.version.outputs.version }}</version>|" src/DKNet.Minimal.Template.nuspec
          rm src/DKNet.Minimal.Template.nuspec.bak

      - name: Pack template
        run: dotnet pack src/DKNet.Minimal.Template.csproj -c Release -o src/nupkgs

      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name "github" \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Push package to GitHub Packages
        run: |
          dotnet nuget push "src/nupkgs/*.nupkg" \
            --source "github" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
    
    # Create Release
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          #files: ${{ runner.WORKSPACE }}/nupkgs/release.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}

  # The dknet-minimal agent-skills plugin (repository root: .claude-plugin/, skills/, agents/) goes to npmjs.com
  # AFTER the NuGet template package, stamped with the SAME version number. No tag and no GitHub release of its
  # own — the v<version> release above already marks the commit. The repo keeps the placeholder 0.0.0 in
  # package.json, plugin.json and .claude-plugin/plugin.json; the version is injected here, exactly like the
  # nuspec <version> is stamped for the template.
  #
  # Releases from `main` only. A version already on npm is skipped, so a re-run of the same commit is a no-op.
  # Auth: npm Trusted Publishing (OIDC) — https://docs.npmjs.com/trusted-publishers. No NPM_TOKEN secret.
  # One-time setup on npmjs.com → package @drunkcoding/dknet-implementation-skills → Settings → Trusted Publisher →
  # GitHub Actions, owner/repo `baoduy/DKNet.Templates`, workflow filename `publish-nuget-github.yml` (exact,
  # case-sensitive, with the extension), environment left blank. Then set publishing access to "Require
  # two-factor authentication and disallow tokens". npm generates the provenance attestation automatically.
  publish-npm:
    name: Publish dknet-minimal skills (npm)
    needs: publish
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC) + automatic provenance
    env:
      VERSION: ${{ needs.publish.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm >= 11.5.1 / node >= 22.14; node 24 ships it. No registry-url: that only
      # writes an .npmrc `_authToken` line, and an empty one fails the publish with ENEEDAUTH.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: astral-sh/setup-uv@v6

      - name: Stamp the release version into package.json, plugin.json and .claude-plugin/plugin.json
        # `npm version` updates package.json and runs the "version" script (scripts/sync-version.mjs).
        run: npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Validate every skill against the Agent Skills spec
        run: |
          set -euo pipefail
          for d in skills/*/; do
            uvx --from skills-ref agentskills validate "$d"
            lines=$(wc -l < "$d/SKILL.md")
            [ "$lines" -le 500 ] || { echo "$d/SKILL.md has $lines lines (> 500)"; exit 1; }
          done

      - name: Validate the Claude Code plugin (skills/ and agents/ are covered by validate-plugin.sh below)
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          claude --version
          claude plugin validate . --strict

      - name: Repository content checks
        run: ./validate-plugin.sh

      - name: Skills are discoverable by `npx skills add`
        run: npx -y skills@latest add ./ --list

      - name: Already on npm?
        id: exists
        run: |
          name=$(node -p "require('./package.json').name")
          if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
            echo "${name}@${VERSION} is already published — skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npmjs.com
        if: ${{ steps.exists.outputs.exists == 'false' }}
        run: |
          echo "Publishing ${VERSION} to the 'latest' dist-tag"
          npm publish --access public
